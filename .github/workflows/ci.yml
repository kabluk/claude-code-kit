name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: context_monitor tests
        run: python scripts/context_monitor.test.py

      - name: Python syntax
        run: python -m py_compile scripts/*.py

      - name: Shell syntax (bash -n)
        run: |
          for f in hooks/*.sh scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: JSON is valid
        run: python -m json.tool settings.example.json > /dev/null

      - name: Hook smoke test (stop-cycle.sh stays silent on empty input)
        run: |
          out=$(echo '{}' | bash hooks/stop-cycle.sh)
          test -z "$out"

      - name: Hook smoke test (stop-cycle.sh blocks a cycle with a commit and no options)
        run: |
          t=$(mktemp)
          echo '{"type":"user","message":{"content":"do it"}}' > "$t"
          echo '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Bash","input":{"command":"git commit -m x"}}]}}' >> "$t"
          out=$(printf '{"transcript_path":"%s"}' "$t" | bash hooks/stop-cycle.sh)
          echo "$out"
          echo "$out" | grep -q '"decision": "block"'

      - name: Frontmatter parses (agents, commands, skills)
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          files = sorted([*pathlib.Path("agents").glob("*.md"),
                          *pathlib.Path("commands").glob("*.md"),
                          *pathlib.Path("skills").glob("*/SKILL.md")])
          for p in files:
              fm = yaml.safe_load(p.read_text(encoding="utf-8").split("---\n")[1])
              assert fm.get("description"), f"{p}: no description"
              if p.parent.parent.name == "skills":
                  assert fm.get("name") == p.parent.name, f"{p}: name != folder"
          print(f"{len(files)} files ok")
          PY

      - name: Node syntax
        run: |
          for f in skills/*/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done
