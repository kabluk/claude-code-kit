name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: context_monitor tests
        run: python scripts/context_monitor.test.py

      - name: Python syntax
        run: python -m py_compile scripts/*.py

      - name: Shell syntax (bash -n)
        run: |
          for f in hooks/*.sh scripts/*.sh skills/*/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Skill catalog lists every skill, agent and command
        run: bash scripts/check-catalog.sh

      - name: Skill catalog hook prints the catalog
        run: CLAUDE_PROJECT_DIR=$PWD bash hooks/skill-catalog.sh | grep -q '^## Skill catalog'

      - name: Session-start hook injects caveman and names the orchestrator step
        run: |
          p=$(mktemp -d); mkdir -p "$p/.claude/hooks" "$p/.claude/skills"
          cp hooks/session-start.sh "$p/.claude/hooks/"
          cp -r skills/caveman skills/project-orchestrator "$p/.claude/skills/"
          ctx=$(bash "$p/.claude/hooks/session-start.sh" | jq -r .hookSpecificOutput.additionalContext)
          grep -q 'CAVEMAN RULES (verbatim' <<<"$ctx"
          grep -q 'step 1b, not an option' <<<"$ctx"
          ! grep -q 'is available and must be used for large' <<<"$ctx"
          rm -r "$p/.claude/skills"
          ctx=$(bash "$p/.claude/hooks/session-start.sh" | jq -r .hookSpecificOutput.additionalContext)
          grep -q 'caveman/SKILL.md is MISSING' <<<"$ctx"
          grep -q 'project-orchestrator is MISSING' <<<"$ctx"

      - name: kit-sync installs, updates and honours kit-local
        run: |
          p=$(mktemp -d); mkdir -p "$p/.claude/skills/harvest" "$p/.claude/skills/gate"
          echo old > "$p/.claude/skills/harvest/SKILL.md"; echo old > "$p/.claude/skills/gate/SKILL.md"
          echo 'skills/gate  # local on purpose' > "$p/.claude/kit-local"
          bash scripts/kit-sync.sh update "$p" | grep -q '^updated  skills/harvest'
          grep -q '^old$' "$p/.claude/skills/gate/SKILL.md"
          (cd "$p" && bash "$GITHUB_WORKSPACE/scripts/kit-sync.sh" install skills/site-launch | grep -q '^installed  skills/site-launch')
          test -f "$p/.claude/skills/site-launch/launch-check.sh"

      - name: kit-sync holds a skill whose extra file project code uses
        run: |
          p=$(mktemp -d); mkdir -p "$p/.claude/skills/harvest" "$p/.github/workflows"
          echo old > "$p/.claude/skills/harvest/SKILL.md"; echo x > "$p/.claude/skills/harvest/local.sh"
          echo 'run: bash .claude/skills/harvest/local.sh' > "$p/.github/workflows/audit.yml"
          bash scripts/kit-sync.sh status "$p" | grep -q '^warning  skills/harvest: .*local.sh <- .github/workflows/audit.yml'
          bash scripts/kit-sync.sh update "$p" | grep -q '^held  skills/harvest'
          test -f "$p/.claude/skills/harvest/local.sh"
          bash scripts/kit-sync.sh update --overwrite-referenced "$p" | grep -q '^updated  skills/harvest'

      - name: thread-check hook finds the named thread
        run: |
          t=$(mktemp)
          echo '{"type":"assistant","message":{"content":[{"type":"text","text":"**Thread:** demo · kit · done when green"}]}}' > "$t"
          echo "{\"transcript_path\":\"$t\"}" | bash hooks/thread-check.sh | grep -q '^Session thread: demo · kit'
          echo '{}' | bash hooks/thread-check.sh | grep -q '^No session thread named yet'

      - name: JSON is valid
        run: python -m json.tool settings.example.json > /dev/null

      - name: Hook smoke test (stop-cycle.sh stays silent on empty input)
        run: |
          out=$(echo '{}' | bash hooks/stop-cycle.sh)
          test -z "$out"

      - name: Hook smoke test (stop-cycle.sh blocks a cycle with a commit and no options)
        run: |
          t=$(mktemp)
          echo '{"type":"user","message":{"content":"do it"}}' > "$t"
          echo '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Bash","input":{"command":"git commit -m x"}}]}}' >> "$t"
          out=$(printf '{"transcript_path":"%s"}' "$t" | bash hooks/stop-cycle.sh)
          echo "$out"
          echo "$out" | grep -q '"decision": "block"'

      - name: Frontmatter parses (agents, commands, skills)
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          files = sorted([*pathlib.Path("agents").glob("*.md"),
                          *pathlib.Path("commands").glob("*.md"),
                          *pathlib.Path("skills").glob("*/SKILL.md")])
          for p in files:
              fm = yaml.safe_load(p.read_text(encoding="utf-8").split("---\n")[1])
              assert fm.get("description"), f"{p}: no description"
              if p.parent.parent.name == "skills":
                  assert fm.get("name") == p.parent.name, f"{p}: name != folder"
          print(f"{len(files)} files ok")
          PY

      - name: Node syntax
        run: |
          for f in skills/*/*.mjs skills/*/scripts/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done
